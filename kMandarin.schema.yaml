# Rime schema
# encoding: utf-8
#
# 汉字带声调注音——仅作为反查注音的数据源（radical_reverse_lookup/dictionary: kMandarin），
# 挂在各输入方案的 schema/dependencies 下以便部署时编译出 kMandarin.reverse.bin；
# 不在方案选单中出现，也不用于输入。词典由 tools/gen_kmandarin.py 自 Unihan 生成。

schema:
  schema_id: kMandarin
  name: 汉字注音（带声调，反查用）
  version: "1.0"
  author:
    - Unicode Unihan Database
  description: |
    带声调拼音注音数据（kTGHZ2013 / kMandarin），供部件拆字反查显示注音。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜńňǹḿ"

translator:
  dictionary: kMandarin
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
