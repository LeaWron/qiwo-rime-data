# 这份数据被五个端同时消费（qiwo-win / qiwo-mac / qiwo-lin / qiwo-android，
# 以及 qiwo-sync-core 的共享目录自检）。一个坏掉的 YAML 或一处引用不到的 lua
# 会同时发给所有客户端，而且往往要到用户机器上部署失败才暴露——此前这个仓
# 没有任何 CI，改坏了只能靠人眼。
#
# 公开仓，Actions 免费；整轮不到一分钟。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate bundled Rime data
        run: python tools/validate.py
