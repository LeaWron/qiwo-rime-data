# 平台层：同一份数据仓五端共用，只有这里按端不同。
#
# 十个白霜系方案的 engine/processors 里，编辑器一项写的是
#   - __include: qiwo_platform:/editor
# 引用的就是本文件。根目录这份是移动端默认值：Android/iOS 整棵树安装即得。
# 桌面三端（Windows/macOS/Linux）打包时用 qiwo_platform.desktop.yaml 覆盖本文件。
# 本文件缺失会让所有引用它的方案编译失败（librime 会沿用旧 build，静默出错），
# 所以它必须随数据仓一起分发，tools/validate.py 与各端打包断言都检查它。
#
# editor: express_editor —— 空格直接上屏、回车上屏原始字母、退格删字母（刚选完词时退格撤销选择）。
#   2026-08-31 D12 曾定移动端 fluid_editor（整句编辑、回车上屏、退格无条件回退已选段），
#   但 Android 设备因用户目录旧副本遮蔽，实际一直跑的是 express；0.2.5 清掉遮蔽后 fluid
#   首次真正生效，用户明确不要（「更新前的那个就很好」），与桌面 2026-09-10 回到 express
#   的理由相同（选词后还要回车）。故 2026-09-10 撤销 D12：两端默认都是 express，平台层
#   机制保留，将来若某端要 fluid 只改这里。
editor: express_editor
